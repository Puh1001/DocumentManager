# GitLab CI/CD Pipeline for ISO Document Manager
# Monorepo with Turbo, NestJS (API), Next.js (Web)

# Include security templates
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Pipeline stages
stages:
  - install
  - validate
  - test
  - build
  - security
  - docker
  - deploy

# Global variables
variables:
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  TURBO_TOKEN: "$CI_JOB_TOKEN"
  TURBO_TEAM: "$CI_PROJECT_NAMESPACE"
  # Security scanning
  SECRET_DETECTION_ENABLED: "true"
  SAST_EXCLUDED_ANALYZERS: ""
  # Docker
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Cache configuration
.npm_cache: &npm_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
      - node_modules
    policy: pull-push

.turbo_cache: &turbo_cache
  cache:
    key:
      files:
        - turbo.json
      prefix: turbo
    paths:
      - .turbo
    policy: pull-push

# Base image for Node.js jobs
.node_base: &node_base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git python3 make g++

# ============================================
# INSTALL STAGE
# ============================================

install_dependencies:
  <<: *node_base
  <<: *npm_cache
  stage: install
  script:
    - npm ci --prefer-offline
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    expire_in: 1 hour

# ============================================
# VALIDATE STAGE
# ============================================

lint:
  <<: *node_base
  stage: validate
  dependencies:
    - install_dependencies
  script:
    - npm run lint
  allow_failure: false

type_check_api:
  <<: *node_base
  stage: validate
  dependencies:
    - install_dependencies
  script:
    - cd apps/api
    - npm run type-check
  allow_failure: false

type_check_web:
  <<: *node_base
  stage: validate
  dependencies:
    - install_dependencies
  script:
    - cd apps/web
    - npm run type-check
  allow_failure: false

# ============================================
# TEST STAGE
# ============================================

test_api:
  <<: *node_base
  stage: test
  <<: *turbo_cache
  dependencies:
    - install_dependencies
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: documents_db_test
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
  variables:
    DATABASE_URL: "postgresql://test_user:test_password@postgres:5432/documents_db_test?schema=public"
  script:
    - cd apps/api
    - npx prisma generate
    - npm run test:cov || npm run test
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml
    paths:
      - apps/api/coverage/
    expire_in: 1 week
  allow_failure: false

test_web:
  <<: *node_base
  stage: test
  <<: *turbo_cache
  dependencies:
    - install_dependencies
  script:
    - cd apps/web
    - npm run test || echo "No tests configured yet"
  allow_failure: true

# ============================================
# BUILD STAGE
# ============================================

build_api:
  <<: *node_base
  stage: build
  <<: *turbo_cache
  dependencies:
    - install_dependencies
  script:
    - cd apps/api
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - apps/api/dist/
      - apps/api/prisma/
    expire_in: 1 week

build_web:
  <<: *node_base
  stage: build
  <<: *turbo_cache
  dependencies:
    - install_dependencies
  script:
    - cd apps/web
    - npm run build
  artifacts:
    paths:
      - apps/web/.next/
      - apps/web/out/
    expire_in: 1 week

# ============================================
# SECURITY STAGE
# ============================================

# SAST is included via template, customize if needed
sast:
  stage: security
  variables:
    SAST_EXCLUDED_PATHS: "node_modules,dist,build,.next,.turbo"
  allow_failure: true

# Secret Detection is included via template
secret_detection:
  stage: security
  variables:
    SECRET_DETECTION_EXCLUDED_PATHS: "node_modules,dist,build,.next,.turbo,coverage"
  allow_failure: true

# ============================================
# DOCKER STAGE
# ============================================

docker_build_api:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_BUILDKIT: 1
  dependencies:
    - build_api
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -f apps/api/Dockerfile \
        -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA \
        -t $CI_REGISTRY_IMAGE/api:latest \
        .
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/api:latest
  only:
    - main
    - master
    - tags
  when: manual

docker_build_web:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_BUILDKIT: 1
  dependencies:
    - build_web
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -f apps/web/Dockerfile \
        -t $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA \
        -t $CI_REGISTRY_IMAGE/web:latest \
        .
    - docker push $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/web:latest
  only:
    - main
    - master
    - tags
  when: manual

# ============================================
# DEPLOYMENT STAGE
# ============================================

deploy_staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploy to staging environment"
    - echo "Add your deployment script here"
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - main
    - master
  when: manual

deploy_production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploy to production environment"
    - echo "Add your deployment script here"
  environment:
    name: production
    url: https://production.example.com
  only:
    - tags
  when: manual
