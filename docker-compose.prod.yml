version: "3.8"

services:web:
  build:
    context: .
    dockerfile: apps/web/Dockerfile
  container_name: iso-docs-web
  restart: unless-stopped
  environment:
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
  ports:
    - "${WEB_PORT}:3000"
  depends_on:
    - api

api:
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  container_name: iso-docs-api
  restart: unless-stopped
  environment:
    - NODE_ENV=${NODE_ENV}
    - DATABASE_URL=${DATABASE_URL}
    - JWT_SECRET=${JWT_SECRET}
    - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
    - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
    - SMB_MOUNT_PATH=${SMB_MOUNT_PATH}
    - SMB_BASE_PATH=${SMB_BASE_PATH}
    - SMB_NETWORK_PATH=${SMB_NETWORK_PATH}
    - CORS_ORIGIN=${CORS_ORIGIN}
  ports:
    - "${API_PORT}:3001"
  volumes:
    - ${SMB_MOUNT_PATH_HOST}:/shared
  depends_on:
    postgres:
      condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: iso-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: documents_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d documents_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
